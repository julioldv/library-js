<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>My Library</h1>

    <main class="library">
      <section class="book-form-container">
        <h2>Add a new book</h2>

        <form class="book-form" action="#" method="post">
          <div class="form-field">
            <label for="book-title">Title</label>
            <input type="text" name="book-title" id="book-title" required />
          </div>

          <div class="form-field">
            <label for="book-author">Author</label>
            <input type="text" name="book-author" id="book-author" required />
          </div>

          <div class="form-field">
            <label for="total-pages">Pages</label>
            <input
              type="number"
              name="total-pages"
              id="total-pages"
              min="1"
              required
            />
          </div>

          <fieldset class="form-field">
            <legend>Reading status</legend>

            <label>
              <input type="radio" name="read-status" value="read" />
              Read
            </label>

            <label>
              <input type="radio" name="read-status" value="not-read" checked />
              Not read
            </label>
          </fieldset>

          <button type="submit">Add new book</button>
        </form>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
